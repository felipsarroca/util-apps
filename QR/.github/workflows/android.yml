name: Android

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Proves i APK de depuració
        run: bash ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Restaura la clau de signatura
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          QR_KEYSTORE_BASE64: ${{ secrets.QR_KEYSTORE_BASE64 }}
        run: |
          test -n "$QR_KEYSTORE_BASE64"
          printf '%s' "$QR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lector-qr.jks"
      - name: Compila i verifica l'APK signat
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          QR_KEYSTORE_FILE: ${{ runner.temp }}/lector-qr.jks
          QR_KEYSTORE_PASSWORD: ${{ secrets.QR_KEYSTORE_PASSWORD }}
          QR_KEY_ALIAS: ${{ secrets.QR_KEY_ALIAS }}
          QR_KEY_PASSWORD: ${{ secrets.QR_KEY_PASSWORD }}
        run: |
          test -n "$QR_KEYSTORE_PASSWORD" && test -n "$QR_KEY_ALIAS" && test -n "$QR_KEY_PASSWORD"
          bash ./gradlew assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" app-release.apk
          sha256sum app-release.apk > SHA256SUMS.txt
      - name: Publica la versió estable
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app-release.apk SHA256SUMS.txt \
            --title "Lector QR $GITHUB_REF_NAME" \
            --notes-file NOTES.md \
            --verify-tag
      - name: Elimina la clau temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/lector-qr.jks"

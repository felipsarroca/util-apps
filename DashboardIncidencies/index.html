<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173f91" />
    <title>Dashboard d'incidències · Escola Ramon Pont</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Una URL nova evita que el navegador reutilitzi una còpia incompleta dels estils.
      const stylesheet = document.createElement("link");
      stylesheet.rel = "stylesheet";
      stylesheet.href = `./styles.css?v=${Date.now()}`;
      document.head.append(stylesheet);
    </script>
    <script type="module" src="./src/app.js?v=3"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">▥</span>
        <div>
          <h1>Dashboard d'incidències</h1>
          <p>
            Anàlisi de dades escolars ·
            <strong>Escola Ramon Pont (Terrassa)</strong>
          </p>
        </div>
      </div>
      <button
        id="change-sheet"
        class="button button-light"
        type="button"
        hidden
      >
        Canvia el full
      </button>
    </header>
    <main id="app" class="main" aria-live="polite"></main>
    <footer class="felip-app-footer">
      <a
        class="felip-license-image-link"
        href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ca"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Llicència Creative Commons BY-NC-SA 4.0"
        ><img
          class="felip-license-image"
          src="./assets/CC_BY-NC-SA.png"
          alt="Creative Commons BY-NC-SA"
      /></a>
      <div class="felip-footer-text">
        <p>
          Aplicació creada per
          <a
            href="https://ja.cat/felipsarroca"
            target="_blank"
            rel="noopener noreferrer"
            >Felip Sarroca</a
          >
          amb assistència de la IA
        </p>
        <p>
          Obra sota llicència
          <a
            href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ca"
            target="_blank"
            rel="noopener noreferrer"
            >CC BY-NC-SA 4.0</a
          >
        </p>
      </div>
    </footer>
  </body>
</html>

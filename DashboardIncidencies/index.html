<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173f91" />
    <title>Dashboard d'incidències · Escola Ramon Pont</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Una URL nova evita que el navegador reutilitzi una còpia incompleta dels estils.
      const stylesheet = document.createElement("link");
      stylesheet.rel = "stylesheet";
      stylesheet.href = `./styles.css?v=${Date.now()}`;
      document.head.append(stylesheet);
    </script>
    <script type="module" src="./src/app.js?v=5"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            width="28"
            height="28"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
        </span>
        <div>
          <h1>Dashboard d'incidències</h1>
          <p>
            <em>Anàlisi de dades escolars</em> -
            <strong>Escola Ramon Pont (Terrassa)</strong>
          </p>
        </div>
      </div>
      <button
        id="change-sheet"
        class="button button-change"
        type="button"
        hidden
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          width="17"
          height="17"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 4v5h5M20 20v-5h-5"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 9a9 9 0 0114.13-5.13M20 15a9 9 0 01-14.13 5.13"
          />
        </svg>
        Canvia el full
      </button>
    </header>
    <main id="app" class="main" aria-live="polite"></main>
    <footer class="felip-app-footer">
      <a
        class="felip-license-image-link"
        href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ca"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Llicència Creative Commons BY-NC-SA 4.0"
        ><img
          class="felip-license-image"
          src="./assets/CC_BY-NC-SA.png"
          alt="Creative Commons BY-NC-SA"
      /></a>
      <div class="felip-footer-text">
        <p>
          Aplicació creada per
          <a
            href="https://ja.cat/felipsarroca"
            target="_blank"
            rel="noopener noreferrer"
            >Felip Sarroca</a
          >
          amb assistència de la IA
        </p>
        <p>
          Obra sota llicència
          <a
            href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ca"
            target="_blank"
            rel="noopener noreferrer"
            >CC BY-NC-SA 4.0</a
          >
        </p>
      </div>
    </footer>
  </body>
</html>

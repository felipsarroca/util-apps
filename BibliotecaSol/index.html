<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca de la Sol - Escola Ramon Pont</title>
    <link rel="icon" href="assets/logo-sol.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css?v=1.2">
    <script src="js/config.js?v=1.2" defer></script>
    <script src="js/supabaseClient.js?v=1.2" defer></script>
    <script src="js/shared.js?v=1.2" defer></script>
    <script src="js/cataleg.js?v=1.2" defer></script>
  </head>
  <body class="home-page">
    <main class="home-shell">
      <section class="home-hero">
        <div class="home-hero-main">
          <div class="hero-title">
            <img src="assets/logo-sol.svg" alt="" width="64" height="64">
            <div>
              <h1>Biblioteca de la Sol</h1>
              <p class="subtitle"><em>Escola Ramon Pont</em></p>
            </div>
          </div>

          <form id="home-login-form" class="home-login-form">
            <label for="home-email">Vols demanar llibres? Entra amb el correu del centre</label>
            <div class="search-row">
              <input id="home-email" name="email" type="email" autocomplete="email" required placeholder="nom@ramonpont.cat">
              <button class="button icon-login" type="submit">Entrar</button>
            </div>
            <p id="home-login-message" class="form-message" role="status"></p>
          </form>
        </div>

        <aside class="summary-panel" aria-label="Resum del catàleg">
          <dl class="stats-grid">
            <div>
              <dt id="stat-books">–</dt>
              <dd>Llibres</dd>
            </div>
            <div>
              <dt id="stat-copies">–</dt>
              <dd>Exemplars</dd>
            </div>
            <div>
              <dt id="stat-available">–</dt>
              <dd>Disponibles</dd>
            </div>
          </dl>
          <a class="button button-secondary icon-catalog" href="cataleg.html?mode=public">Veure tot el catàleg</a>
        </aside>
      </section>

      <section class="home-new" data-home-new hidden>
        <div class="home-new-head">
          <h2>Darreres incorporacions</h2>
          <a href="cataleg.html?mode=public">Veure'ls tots →</a>
        </div>
        <div id="home-new" class="new-strip"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p><a href="https://ja.cat/felipsarroca">Felip Sarroca</a> - Biblioteca de la Sol v1.2</p>
      <p>Codi: <a href="https://github.com/felipsarroca/util-apps/blob/main/BibliotecaSol/LICENSE.txt" rel="noopener">AGPLv3</a> · Continguts: <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ca" rel="noopener">CC BY-NC-SA 4.0</a> · © 2026 · <a href="https://github.com/felipsarroca/util-apps/issues/new?template=biblioteca-sol.yml" rel="noopener">Suggeriments i errors</a></p>
    </footer>
  </body>
</html>

<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analitzador de tickets</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="https://unpkg.com/tesseract.js@5.0.3/dist/tesseract.min.js" crossorigin="anonymous"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="favicon.svg" alt="" aria-hidden="true" />
        <h1>Analitzador de tickets</h1>
      </div>
    </header>

    <main class="container">
      <section class="uploader">
        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Arrossega els JPG o PNG aquí o fes clic per seleccionar">
          <p><strong>Arrossega els tiquets (JPG o PNG)</strong> o fes clic per seleccionar</p>
          <input id="fileInput" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple />
        </div>
        <div class="controls">
          <button id="clearDataBtn" class="btn btn-secondary">Esborra tots els tiquets</button>
          <button id="exportCsvBtn" class="btn">Exporta CSV</button>
        </div>
        <div id="progress" class="progress hidden"></div>
      </section>

      <details id="history" class="history">
        <summary id="historyLabel">Altres tiquets</summary>
        <div id="historyList"></div>
      </details>
      <div id="workspace" class="workspace">
        <aside class="stats">
          <h2>Resum del tiquet</h2>
          <div id="aggregateCards" aria-live="polite"></div>
        </aside>
        <section class="tickets">
          <h2>Tiquet actiu</h2>
          <div id="ticketsList" class="tickets-list"></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <small>Funciona al navegador. Dades guardades a l'ordinador (localStorage).</small>
    </footer>
  </body>
  </html>

name: DescarregApp - monitor de descàrregues

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepara el motor inclòs a l'app
        run: |
          VERSION=$(node -e "console.log(require('./DescarregApp/scripts/tool-versions.json').ytDlp.version)")
          curl -fL --retry 3 "https://github.com/yt-dlp/yt-dlp/releases/download/$VERSION/yt-dlp" -o yt-dlp-bin
          chmod +x yt-dlp-bin
          command -v ffmpeg
      - name: Prova vídeo i àudio de YouTube i 3Cat
        id: health
        continue-on-error: true
        working-directory: DescarregApp
        run: node scripts/check-health.js --bin ../yt-dlp-bin --deno deno --ffmpeg ffmpeg
      - name: Obre o tanca incidències segons el resultat
        if: always() && steps.health.outputs.youtube_status != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          YOUTUBE_STATUS: ${{ steps.health.outputs.youtube_status }}
          CAT3_STATUS: ${{ steps.health.outputs.cat3_status }}
        run: |
          for SERVICE in youtube cat3; do
            if [ "$SERVICE" = youtube ]; then
              NAME=YouTube
              STATUS="$YOUTUBE_STATUS"
            else
              NAME=3Cat
              STATUS="$CAT3_STATUS"
            fi
            TITLE="[ALERTA] DescarregApp no pot descarregar de $NAME"
            ISSUE=$(gh issue list --repo "$REPOSITORY" --state open --search "$TITLE in:title" --json number -q '.[0].number')
            if [ "$STATUS" = failed ] && [ -z "$ISSUE" ]; then
              printf 'La prova diària de vídeo o MP3 de %s ha fallat amb el motor inclòs a DescarregApp.\n\nRevisa el registre de GitHub Actions i prepara una versió nova si el problema és de yt-dlp.\n' "$NAME" > issue_body.md
              gh issue create --repo "$REPOSITORY" --title "$TITLE" --body-file issue_body.md
            elif [ "$STATUS" = ok ] && [ -n "$ISSUE" ]; then
              gh issue close "$ISSUE" --repo "$REPOSITORY" --comment "La prova diària de vídeo i MP3 torna a funcionar."
            elif [ "$STATUS" = inconclusive ]; then
              echo "Prova inconclusa de $NAME; es conserva l'estat de la incidència."
            fi
          done
      - name: Notifica una nova versió de yt-dlp
        if: steps.health.outputs.has_new_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LATEST: ${{ steps.health.outputs.latest_version }}
          RELEASE_URL: ${{ steps.health.outputs.release_url }}
        run: |
          TITLE="Nova versió de yt-dlp disponible: $LATEST"
          ISSUE=$(gh issue list --repo "$REPOSITORY" --state open --search "$TITLE in:title" --json number -q '.[0].number')
          if [ -z "$ISSUE" ]; then
            printf 'Hi ha una [nova versió de yt-dlp](%s). Revisa si cal actualitzar el motor, valida les descàrregues i publica una nova versió de DescarregApp.\n' "$RELEASE_URL" > issue_body.md
            gh issue create --repo "$REPOSITORY" --title "$TITLE" --body-file issue_body.md
          fi
      - name: Marca la comprovació com a fallida si cal
        if: always()
        env:
          YOUTUBE_STATUS: ${{ steps.health.outputs.youtube_status }}
          CAT3_STATUS: ${{ steps.health.outputs.cat3_status }}
        run: |
          if [ "$YOUTUBE_STATUS" = failed ] || [ "$CAT3_STATUS" = failed ]; then exit 1; fi
          if [ -z "$YOUTUBE_STATUS" ] || [ -z "$CAT3_STATUS" ]; then exit 1; fi

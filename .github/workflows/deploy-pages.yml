name: Publica util-apps a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            AvaluApp/package-lock.json
            LaTevaVeu/package-lock.json

      - name: Instal·la les dependències d'AvaluApp
        working-directory: AvaluApp
        run: npm ci

      - name: Compila AvaluApp
        working-directory: AvaluApp
        run: npm run build

      - name: Instal·la les dependències de La teva veu
        working-directory: LaTevaVeu
        run: npm ci

      # Dues versions: la demostració (dades fictícies al navegador) a LaTevaVeu/demo/ i, a
      # LaTevaVeu/, l'app connectada al servidor (Neon Functions) amb Google. Mentre no hi hagi
      # les variables del repositori LATEVAVEU_API_URL i LATEVAVEU_GOOGLE_CLIENT_ID, totes dues són la demostració.
      - name: Prova i compila La teva veu
        working-directory: LaTevaVeu
        env:
          API_URL: ${{ vars.LATEVAVEU_API_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.LATEVAVEU_GOOGLE_CLIENT_ID }}
        run: |
          npm test
          npm run build -- --outDir dist-demo
          if [ -n "$API_URL" ] && [ -n "$GOOGLE_CLIENT_ID" ]; then
            VITE_API_URL="$API_URL" VITE_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" VITE_DEMO_URL="demo/#/demo" npx vite build
          else
            cp -R dist-demo dist
          fi

      - name: Prepara el portal complet
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude .git \
            --exclude .github \
            --exclude _site \
            --exclude AvaluApp \
            --exclude LaTevaVeu \
            --exclude MAvaluo
          mkdir _site/AvaluApp _site/LaTevaVeu _site/MAvaluo
          cp -R AvaluApp/dist/. _site/AvaluApp/
          cp -R LaTevaVeu/dist/. _site/LaTevaVeu/
          mkdir _site/LaTevaVeu/demo
          cp -R LaTevaVeu/dist-demo/. _site/LaTevaVeu/demo/
          # Adreça antiga de La teva veu: redirigeix-la i conserva l'apartat (#/em-miro, #/et-veig).
          cat > _site/MAvaluo/index.html <<'HTML'
          <!doctype html>
          <html lang="ca">
          <meta charset="utf-8">
          <title>La teva veu</title>
          <meta http-equiv="refresh" content="0; url=../LaTevaVeu/">
          <script>location.replace('../LaTevaVeu/' + location.hash)</script>
          <p>L'aplicació s'ha traslladat a <a href="../LaTevaVeu/">La teva veu</a>.</p>
          </html>
          HTML

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Desa l'artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

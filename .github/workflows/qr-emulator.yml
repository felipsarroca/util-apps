name: Lector QR en emulador
on: workflow_dispatch

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Activa KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instal·la i obre Lector QR
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          script: |
            bash QR/gradlew -p QR assembleDebug
            adb install -r QR/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant cat.felipsarroca.lectorqr android.permission.CAMERA
            adb shell am start -n cat.felipsarroca.lectorqr/.MainActivity
            sleep 8
            adb shell dumpsys activity activities | grep 'cat.felipsarroca.lectorqr/.MainActivity'
            adb exec-out screencap -p > escaner.png
            bash QR/gradlew -p QR connectedDebugAndroidTest
            adb shell settings put system font_scale 1.3
            bash QR/gradlew -p QR connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.sufix=-gran
            adb shell settings put system font_scale 1.0
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb shell wm user-rotation lock 1 || true
            sleep 3
            adb install -r QR/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant cat.felipsarroca.lectorqr android.permission.CAMERA
            adb shell am start -n cat.felipsarroca.lectorqr/.MainActivity
            sleep 8
            adb exec-out screencap -p > escaner-horitzontal.png
            bash QR/gradlew -p QR connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.sufix=-horitzontal
            for f in resultat-enllac resultat-wifi resultat-esdeveniment resultat-avis resultat-enllac-gran resultat-wifi-gran resultat-esdeveniment-gran resultat-avis-gran resultat-enllac-horitzontal resultat-wifi-horitzontal resultat-esdeveniment-horitzontal resultat-avis-horitzontal; do adb pull "/sdcard/Pictures/LectorQR/$f.png" "$f.png" && test $(wc -c < "$f.png") -gt 1000 || exit 1; done
            if adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-lector-qr
          path: |
            escaner*.png
            resultat-*.png

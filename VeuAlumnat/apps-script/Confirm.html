<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font:16px Arial,sans-serif;background:#f7f5f1;color:#282522;margin:0;padding:24px}.card{max-width:520px;margin:40px auto;background:#fff;border:1px solid #ddd5cb;border-radius:12px;padding:28px}h1{font-size:22px;color:#831e12}label{display:block;margin:18px 0 7px}input[type=email]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:6px;font-size:16px}button{background:#831e12;color:white;border:0;border-radius:6px;padding:12px 18px;font-size:16px;margin-top:22px;cursor:pointer}#status{margin-top:16px;white-space:pre-wrap}.small{color:#655f57;font-size:13px;line-height:1.5}</style></head><body><main class="card"><h1>Confirmació de lectura</h1><p>Escola Ramon Pont · La veu de l’alumnat</p><form id="form"><label for="email">Adreça electrònica on heu rebut l’informe</label><input id="email" type="email" autocomplete="email" required><label><input id="read" type="checkbox" required> He llegit l’autoavaluació del meu fill o filla.</label><button type="submit">Confirma la lectura</button></form><p id="status"></p><p class="small">Aquesta confirmació registra l’adreça indicada i la declaració de lectura. No verifica la identitat de qui emplena el formulari.</p></main><script>const token=<?= JSON.stringify(token) ?>;document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let status=document.getElementById('status');status.textContent='S’està registrant…';google.script.run.withSuccessHandler(s=>{status.textContent=s;document.getElementById('form').style.display='none'}).withFailureHandler(e=>{status.textContent=e.message||String(e)}).confirmRead(token,document.getElementById('email').value)})</script></body></html>
